name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy ingestion/ streamlit_app/

      - name: dbt parse (validates models/tests compile)
        run: |
          pip install dbt-databricks==1.8.4
          dbt parse --project-dir dbt/f1_lakehouse --profiles-dir dbt/f1_lakehouse
        env:
          DATABRICKS_HOST: dummy
          DATABRICKS_HTTP_PATH: dummy
          DATABRICKS_TOKEN: dummy
          DATABRICKS_CATALOG: f1
