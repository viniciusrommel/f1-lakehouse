[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-lakehouse"
version = "0.1.0"
description = "CDC-based lakehouse platform on Databricks — F1 telemetry as a study payload"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 140
target-version = "py311"
# Notebook do Databricks: usa os globais `spark`/`dbutils`, que so existem
# em tempo de execucao, entao o lint acusaria erro falso.
extend-exclude = ["databricks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
